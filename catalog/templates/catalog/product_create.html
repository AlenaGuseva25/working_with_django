{% extends 'catalog/catalog_base.html' %}

{% block content %}
    <div class="container">
        <h2>{% if form.instance.pk %}Редактировать продукт{% else %}Создать продукт{% endif %}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="position: absolute; left: -9999px;">
                {{ form.honeypot.errors }}
                {{ form.honeypot }}
            </div>

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'catalog:products' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
